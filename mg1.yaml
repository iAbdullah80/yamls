            application/json:
              schema: {$ref: '#/components/schemas/GetComplianceResponse'}
        '400': {$ref: '#/components/responses/BadRequestError'}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /payout/v1/transactions/{transactionId}/commit:
    put:
      tags: [Payout]
      summary: Commit a Transaction
      description: Commits the payout of a transaction.
      operationId: commitPayout
      security:
      - OAuth2: [write]
      parameters:
      - {$ref: '#/components/parameters/ClientRequestIdOptional'}
      - {$ref: '#/components/parameters/MGSessionId'}
      - {$ref: '#/components/parameters/TargetAudience'}
      - {$ref: '#/components/parameters/UserLanguage'}
      - {$ref: '#/components/parameters/AgentPartnerId'}
      - {$ref: '#/components/parameters/PosId'}
      - {$ref: '#/components/parameters/OperatorId'}
      - {$ref: '#/components/parameters/TransactionId'}
      - {$ref: '#/components/parameters/ConsumerIPAddress'}
