        '400': {$ref: '#/components/responses/BadRequestError'}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /amend/v1/transactions/{transactionId}/receiver/name:
    patch:
      tags: [Amend]
      summary: Modify a Receiver's Name
      description: Modifies the receiver name on a transaction.
      operationId: amendReceiverName
      security:
      - OAuth2: [write]
      parameters:
      - {$ref: '#/components/parameters/ClientRequestIdOptional'}
      - {$ref: '#/components/parameters/MGSessionId'}
      - {$ref: '#/components/parameters/TargetAudience'}
      - {$ref: '#/components/parameters/UserLanguage'}
      - {$ref: '#/components/parameters/AgentPartnerId'}
      - {$ref: '#/components/parameters/PosId'}
      - {$ref: '#/components/parameters/OperatorId'}
      - in: path
        name: transactionId
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/ConsumerIPAddress'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/amendNameRequest'}
      responses:
        '200':
          description: Successful response
          headers: *id001
          content:
            application/json:
              schema: {$ref: '#/components/schemas/amendTransactionResponse'}
        '400': {$ref: '#/components/responses/BadRequestError'}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /amend/v1/transactions/{transactionId}/receiver/additional-data:
    patch:
      tags: [Amend]
      summary: Modify a Receiver's Additional Data
      description: Modifies the receiver additional data on a transaction.
      operationId: amendReceiverAdditionalData
      security:
      - OAuth2: [write]
      parameters:
      - {$ref: '#/components/parameters/ClientRequestIdOptional'}
      - {$ref: '#/components/parameters/MGSessionId'}
      - {$ref: '#/components/parameters/TargetAudience'}
      - {$ref: '#/components/parameters/UserLanguage'}
      - {$ref: '#/components/parameters/AgentPartnerId'}
      - {$ref: '#/components/parameters/PosId'}
      - {$ref: '#/components/parameters/OperatorId'}
      - in: path
        name: transactionId
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/ConsumerIPAddress'}
