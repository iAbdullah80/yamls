openapi: 3.0.3
info: {title: MoneyGram Developer APIs, version: 1.0.0, description: 'Unofficial consolidated OpenAPI description of the MoneyGram developer APIs (https://developer.moneygram.com/moneygram-developer/reference). Each API area keeps its own versioned base path (for example /transfer/v1, /refund/v2). Send X-MG-ClientRequestId (a UUID) on every call: it is used for request tracing and idempotency.'}
servers:
- {url: 'https://sandboxapi.moneygram.com', description: Sandbox}
- {url: 'https://api.moneygram.com', description: Production}
tags:
- {name: Authentication, description: OAuth2 token endpoint.}
- {name: Transfer, description: 'Send money: quote, update/validate, create and commit transactions.'}
- {name: Status, description: Transaction status lookup.}
- {name: Refund, description: Look up and refund transactions.}
- {name: Amend, description: Amend receiver details of a transaction.}
- {name: Payout, description: Pay out (receive) transactions.}
- {name: Disbursement, description: Business (B2C) disbursements.}
- {name: DisbursementStatus, description: Business disbursement status lookup.}
- {name: DisbursementRefund, description: Business disbursement refunds.}
- {name: AgentLocator, description: Agent location search.}
- {name: Agent, description: Agent information.}
- {name: FxRate, description: Foreign-exchange rates.}
- {name: ReferenceData, description: 'Reference data: countries, currencies, service options, fields and more.'}
- {name: ConsumerProfiles, description: Consumer profile management.}
- {name: BusinessProfiles, description: Business profile management.}
paths:
  /oauth/accesstoken:
    get:
      tags: [Authentication]
      summary: Get Access Token
      description: Exchanges the partner client id and secret (sent as HTTP Basic credentials) for an OAuth2 bearer token. The token endpoint is called with GET and grant_type=client_credentials.
      operationId: getAccessToken
      security:
      - BasicAuth: []
      parameters:
      - in: query
        name: grant_type
        required: true
        schema:
          type: string
          enum: [client_credentials]
      responses:
        '200':
          description: Successful response
          headers: &id001
            X-MG-SessionId:
              required: false
              schema: {type: string}
            X-MG-ClientRequestId:
              required: false
              schema: {type: string}
            X-MG-RequestId:
              required: false
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GetAccessTokenResponse'}
        '400': {$ref: '#/components/responses/BadRequestErrorAccessToken'}
        '401': {$ref: '#/components/responses/UnauthorizedErrorAccessToken'}
        '403': {$ref: '#/components/responses/ForbiddenErrorAccessToken'}
        '500': {$ref: '#/components/responses/InternalServerErrorAccessToken'}
  /transfer/v1/transactions/quote:
    post:
      tags: [Transfer]
      summary: Quote a Transaction
      description: Requests a quote for a send transaction, specified either by send amount or by receive amount.
      operationId: instructPayoutTransactionQuote
      security:
      - OAuth2: [write]
      parameters:
      - {$ref: '#/components/parameters/ClientRequestIdRequired'}
      - {$ref: '#/components/parameters/ConsumerIPAddress'}
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - {$ref: '#/components/schemas/quoteBySendAmountRequest'}
              - {$ref: '#/components/schemas/quoteByReceiveAmountRequest'}
      responses:
        '200':
          description: Successful response
          headers: *id001
          content:
            application/json:
              schema: {$ref: '#/components/schemas/quoteResponse'}
        '400': {$ref: '#/components/responses/BadRequestError'}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /transfer/v1/transactions/{transactionId}:
    put:
      tags: [Transfer]
      summary: Update a Transaction
      description: Updates a quoted send transaction with sender, receiver and compliance details and validates it.
      operationId: instructPayoutTransactionUpdateAndValidate
      security:
      - OAuth2: [write]
      parameters:
      - {$ref: '#/components/parameters/ClientRequestIdRequired'}
      - in: path
        name: transactionId
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/ConsumerIPAddress'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - {$ref: '#/components/schemas/transactBySendAmountRequest'}
              - {$ref: '#/components/schemas/transactByReceiveAmountRequest'}
      responses:
        '200':
          description: Successful response
          headers: *id001
          content:
            application/json:
              schema: {$ref: '#/components/schemas/transactResponse'}
        '400': {$ref: '#/components/responses/BadRequestError'}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /transfer/v1/transactions/{transactionId}/commit:
    put:
      tags: [Transfer]
      summary: Commit a Transaction
      description: Commits a validated send transaction.
      operationId: instructPayoutTransactionCommit
      security:
      - OAuth2: [write]
      parameters:
      - {$ref: '#/components/parameters/ClientRequestIdRequired'}
      - in: path
        name: transactionId
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/ConsumerIPAddress'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/commitRequest'}
      responses:
        '200':
          description: Successful response
          headers: *id001
          content:
            application/json:
              schema: {$ref: '#/components/schemas/commitResponse'}
        '400': {$ref: '#/components/responses/BadRequestError'}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /transfer/v1/transactions:
    post:
      tags: [Transfer]
      summary: Create a Transaction
      description: Creates a send transaction from a send-amount or receive-amount request.
      operationId: instructPayoutTransactionCreate
      security:
      - OAuth2: [write]
      parameters:
      - {$ref: '#/components/parameters/ClientRequestIdRequired'}
      - {$ref: '#/components/parameters/ConsumerIPAddress'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - {$ref: '#/components/schemas/transactBySendAmountRequest'}
              - {$ref: '#/components/schemas/transactByReceiveAmountRequest'}
      responses:
        '200':
          description: Successful response
          headers: *id001
          content:
            application/json:
              schema: {$ref: '#/components/schemas/transactResponse'}
        '400': {$ref: '#/components/responses/BadRequestError'}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /status/v1/transactions:
    get:
      tags: [Status]
      summary: Retrieve a Transaction by Reference Number
      description: Retrieves the status and details of a transaction by its reference number.
      operationId: transactionLookupWithReferenceNumber
      security:
      - OAuth2: [write]
      parameters:
      - {$ref: '#/components/parameters/ClientRequestIdOptional'}
      - {$ref: '#/components/parameters/TargetAudience'}
      - {$ref: '#/components/parameters/UserLanguage'}
      - {$ref: '#/components/parameters/AgentPartnerId'}
      - {$ref: '#/components/parameters/ReferenceNumber'}
      responses:
        '200':
          description: Successful response
          headers: *id001
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GetTransactionResponse'}
        '400': {$ref: '#/components/responses/BadRequestErrorStatus'}
        '401': {$ref: '#/components/responses/UnauthorizedErrorStatus'}
        '403': {$ref: '#/components/responses/ForbiddenErrorStatus'}
        '500': {$ref: '#/components/responses/InternalServerErrorStatus'}
  /status/v1/transactions/{transactionId}:
    get:
      tags: [Status]
      summary: Retrieve a Transaction by Transaction ID
      description: Retrieves the status and details of a transaction by its transaction id.
      operationId: transactionLookup
      security:
      - OAuth2: [write]
      parameters:
      - {$ref: '#/components/parameters/ClientRequestIdOptional'}
      - {$ref: '#/components/parameters/TargetAudience'}
      - {$ref: '#/components/parameters/UserLanguage'}
      - {$ref: '#/components/parameters/AgentPartnerId'}
      - {$ref: '#/components/parameters/TransactionId'}
      responses:
        '200':
          description: Successful response
          headers: *id001
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GetTransactionResponse'}
        '400': {$ref: '#/components/responses/BadRequestErrorStatus'}
        '401': {$ref: '#/components/responses/UnauthorizedErrorStatus'}
        '403': {$ref: '#/components/responses/ForbiddenErrorStatus'}
        '500': {$ref: '#/components/responses/InternalServerErrorStatus'}
  /refund/v2/transactions:
    get:
      tags: [Refund]
      summary: Retrieve a Transaction by Reference Number
      description: Retrieves a transaction by reference number for the purpose of refunding it.
      operationId: refundTransactionLookupWithReferenceNumber
      security:
      - OAuth2: [write]
      parameters:
      - {$ref: '#/components/parameters/ClientRequestIdOptional'}
      - {$ref: '#/components/parameters/TargetAudience'}
      - {$ref: '#/components/parameters/UserLanguage'}
      - {$ref: '#/components/parameters/AgentPartnerId'}
      - {$ref: '#/components/parameters/PosId'}
      - {$ref: '#/components/parameters/OperatorId'}
      - {$ref: '#/components/parameters/ReferenceNumber'}
      - {$ref: '#/components/parameters/RefundReasonCode'}
      - in: query
        name: refundFee
        schema: {type: boolean}
      - {$ref: '#/components/parameters/ConsumerIPAddress'}
      responses:
        '200':
          description: Successful response
          headers: *id001
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GetTransactionResponseRefund'}
        '400': {$ref: '#/components/responses/BadRequestError'}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /refund/v2/transactions/{transactionId}:
    get:
      tags: [Refund]
      summary: Retrieve a Transaction by Transaction ID
      description: Retrieves a transaction by transaction id for the purpose of refunding it.
      operationId: refundTransactionLookup
      security:
      - OAuth2: [write]
      parameters:
      - {$ref: '#/components/parameters/ClientRequestIdOptional'}
      - {$ref: '#/components/parameters/TargetAudience'}
      - {$ref: '#/components/parameters/UserLanguage'}
      - {$ref: '#/components/parameters/AgentPartnerId'}
      - {$ref: '#/components/parameters/PosId'}
      - {$ref: '#/components/parameters/OperatorId'}
      - {$ref: '#/components/parameters/TransactionId'}
      - {$ref: '#/components/parameters/RefundReasonCode'}
      - in: query
        name: refundFee
        schema: {type: boolean}
      - {$ref: '#/components/parameters/ConsumerIPAddress'}
      responses:
        '200':
          description: Successful response
          headers: *id001
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GetTransactionResponseRefund'}
        '400': {$ref: '#/components/responses/BadRequestError'}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /refund/v2/transactions/{transactionId}/commit:
    put:
      tags: [Refund]
      summary: Commit a Transaction
      description: Commits a refund for a transaction.
      operationId: createOrUpdateTransactionRequest
      security:
      - OAuth2: [write]
      parameters:
      - {$ref: '#/components/parameters/ClientRequestIdOptional'}
      - {$ref: '#/components/parameters/MGSessionId'}
      - in: path
        name: transactionId
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/ConsumerIPAddress'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/commitRequestRefund'}
      responses:
        '200':
          description: Successful response
          headers: *id001
          content:
            application/json:
              schema: {$ref: '#/components/schemas/commitResponseRefund'}
        '400': {$ref: '#/components/responses/BadRequestError'}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /amend/v1/transactions:
    get:
      tags: [Amend]
      summary: Retrieve a Transaction by Reference Number
      description: Retrieves a transaction by reference number for the purpose of amending it.
