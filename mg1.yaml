        '500': {$ref: '#/components/responses/InternalServerError'}
  /disbursement/v1/transactions/quote:
    post:
      tags: [Disbursement]
      summary: Quote a transaction
      description: Requests a quote for a business (B2C) disbursement, by send amount or by receive amount.
      operationId: disbursementInstructPayoutTransactionQuote
      security:
      - OAuth2: [write]
      parameters:
      - {$ref: '#/components/parameters/ClientRequestIdOptional'}
      - {$ref: '#/components/parameters/ConsumerIPAddress'}
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - {$ref: '#/components/schemas/quoteBySendAmountRequestDisbursement'}
              - {$ref: '#/components/schemas/quoteByReceiveAmountRequestDisbursement'}
      responses:
        '200':
          description: Successful response
          headers: *id001
