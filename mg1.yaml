components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: 'Client-credentials flow. Obtain the token with GET /oauth/accesstoken?grant_type=client_credentials using HTTP Basic credentials.'
      flows: {clientCredentials: {tokenUrl: 'https://sandboxapi.moneygram.com/oauth/accesstoken', scopes: {read: Grants read access, write: Grants write access}}}
    BasicAuth: {type: http, scheme: basic, description: 'Client id as username and client secret as password; used only for the token endpoint.'}
  parameters:
    ClientRequestIdRequired: {in: header, name: X-MG-ClientRequestId, schema: {type: string}, required: true}
    ConsumerIPAddress: {in: header, name: X-MG-ConsumerIPAddress, schema: {type: string}}
    ClientRequestIdOptional: {in: header, name: X-MG-ClientRequestId, schema: {type: string}}
    ReferenceNumber: {in: query, name: referenceNumber, required: true, schema: {type: string}}
    TargetAudience: {in: query, name: targetAudience, schema: {type: string}}
    AgentPartnerId: {in: query, name: agentPartnerId, schema: {type: string}, required: true}
    UserLanguage: {in: query, name: userLanguage, required: true, schema: {type: string}}
    TransactionId: {in: path, name: transactionId, schema: {type: string}, required: true}
    PosId: {in: query, name: posId, schema: {type: string}}
    OperatorId: {in: query, name: operatorId, schema: {type: string}}
    RefundReasonCode:
      in: query
      name: refundReasonCode
      required: true
      schema: {type: string, enum: [NO_RCV_LOC, WRONG_SERVICE, NO_TQ, INCORRECT_AMT, MS_NOT_USED, TECH_PROB, CHANGE_MIND, DUP_TRAN, NO_PICKUP, PROB_AT_LOC, STATE_CNTRY_REST, SB_EP, WRONG_CNTRY, WRONG_CRNCY, WRONG_STATE]}
    MGSessionId: {in: header, name: X-MG-SessionId, schema: {type: string}}
    Address: {in: query, name: address, required: true, schema: {type: string}}
    Country: {in: query, name: country, required: true, schema: {type: string, minLength: 2, maxLength: 2}}
    SearchRadius: {in: query, name: searchRadius, required: true, schema: {type: number, minimum: 0}}
    Limit: {in: query, name: limit, schema: {type: number, minimum: 0}}
    TransactionAmount: {in: query, name: transactionAmount, schema: {type: number, minimum: 0}}
    DestinationCountryCode: {in: query, name: destinationCountryCode, schema: {type: string}, required: true}
    OriginatingCountryCode: {in: query, name: originatingCountryCode, required: true, schema: {type: string}}
    SendCurrencyCode: {in: query, name: sendCurrencyCode, required: true, schema: {type: string}}
    ReceiverCurrencyCode: {in: query, name: receiveCurrencyCode, schema: {type: string}}
    ServiceOptionCode: {in: query, name: serviceOptionCode, schema: {type: string}}
    DestinationCountrySubdivisionCode: {in: query, name: destinationCountrySubdivisionCode, schema: {type: string}}
    ServiceOptionRoutingCode: {in: query, name: serviceOptionRoutingCode, schema: {type: string}}
    TransactionIdQuery: {in: query, name: transactionId, schema: {type: string}}
    CountryCode: {in: query, name: countryCode, schema: {type: string}, required: true}
    LanguageLocalId: {in: path, name: languageLocalId, required: true, schema: {type: string}}
    BusinessProfileId: {in: path, name: businessProfileId, schema: {type: string}, required: true}
  responses:
    BadRequestError:
      description: Bad request
      headers: {X-MG-SessionId: {required: false, schema: {type: string}}, X-MG-ClientRequestId: {required: false, schema: {type: string}}, X-MG-RequestId: {required: false, schema: {type: string}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/errorsResponse'}}}
    ForbiddenError:
      description: Forbidden
      headers: {X-MG-SessionId: {required: false, schema: {type: string}}, X-MG-ClientRequestId: {required: false, schema: {type: string}}, X-MG-RequestId: {required: false, schema: {type: string}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/errorsResponse'}}}
    UnauthorizedError:
      description: Unauthorized
      headers: {X-MG-SessionId: {required: false, schema: {type: string}}, X-MG-ClientRequestId: {required: false, schema: {type: string}}, X-MG-RequestId: {required: false, schema: {type: string}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/errorsResponse'}}}
    InternalServerError:
      description: Internal server error
      headers: {X-MG-SessionId: {required: false, schema: {type: string}}, X-MG-ClientRequestId: {required: false, schema: {type: string}}, X-MG-RequestId: {required: false, schema: {type: string}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/errorsResponse'}}}
    BadRequestErrorStatus:
      description: Bad request
      headers: {X-MG-SessionId: {required: false, schema: {type: string}}, X-MG-ClientRequestId: {required: false, schema: {type: string}}, X-MG-RequestId: {required: false, schema: {type: string}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/errorResponse'}}}
    ForbiddenErrorStatus:
      description: Forbidden
      headers: {X-MG-SessionId: {required: false, schema: {type: string}}, X-MG-ClientRequestId: {required: false, schema: {type: string}}, X-MG-RequestId: {required: false, schema: {type: string}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/errorResponse'}}}
    UnauthorizedErrorStatus:
      description: Unauthorized
      headers: {X-MG-SessionId: {required: false, schema: {type: string}}, X-MG-ClientRequestId: {required: false, schema: {type: string}}, X-MG-RequestId: {required: false, schema: {type: string}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/errorResponse'}}}
    InternalServerErrorStatus:
      description: Internal server error
      headers: {X-MG-SessionId: {required: false, schema: {type: string}}, X-MG-ClientRequestId: {required: false, schema: {type: string}}, X-MG-RequestId: {required: false, schema: {type: string}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/errorResponse'}}}
    NoContentError:
      description: No content found for the request
      headers: {X-MG-SessionId: {required: false, schema: {type: string}}, X-MG-ClientRequestId: {required: false, schema: {type: string}}, X-MG-RequestId: {required: false, schema: {type: string}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/NoContentErrorDetails'}}}
    BadRequestErrorAccessToken:
      description: Bad request
      headers: {X-MG-SessionId: {required: false, schema: {type: string}}, X-MG-ClientRequestId: {required: false, schema: {type: string}}, X-MG-RequestId: {required: false, schema: {type: string}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorDetailsAccessToken'}}}
    ForbiddenErrorAccessToken:
      description: Forbidden
      headers: {X-MG-SessionId: {required: false, schema: {type: string}}, X-MG-ClientRequestId: {required: false, schema: {type: string}}, X-MG-RequestId: {required: false, schema: {type: string}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorDetailsAccessToken'}}}
    UnauthorizedErrorAccessToken:
      description: Unauthorized
      headers: {X-MG-SessionId: {required: false, schema: {type: string}}, X-MG-ClientRequestId: {required: false, schema: {type: string}}, X-MG-RequestId: {required: false, schema: {type: string}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorDetailsAccessToken'}}}
    InternalServerErrorAccessToken:
      description: Internal server error
      headers: {X-MG-SessionId: {required: false, schema: {type: string}}, X-MG-ClientRequestId: {required: false, schema: {type: string}}, X-MG-RequestId: {required: false, schema: {type: string}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorDetailsAccessToken'}}}
  schemas:
    Amount: {type: object, properties: {value: {type: number}, currencyCode: {type: string}}}
    BusinessDetails: {type: object, properties: {targetAudience: {type: string, enum: [AGENT_FACING, CUSTOMER_FACING]}, agentPartnerId: {type: string}, posId: {type: string}, operatorId: {type: string}, userLanguage: {type: string}}}
    CustomFields: {minItems: 0, type: array, items: {type: object, properties: {key: {type: string}, value: {type: string}}}}
    ErrorDetails:
      type: object
      required: [category, message]
      properties: {category: {type: string}, code: {type: string}, message: {type: string}, offendingFields: {minItems: 0, type: array, items: {type: object, properties: {field: {type: string}}}}}
    FundInStoreDetails: {type: object, properties: {fundInStore: {type: boolean}, fundInStoreAgentPartnerId: {type: string}}}
    errorsResponse: {type: object, properties: {errors: {type: array, items: {$ref: '#/components/schemas/ErrorDetails'}}}}
    additionalChargesDetails: {type: object, properties: {typeCode: {type: string}, label: {type: string}, value: {type: number}, currencyCode: {type: string}}}
    SendAmountDetails:
      type: object
      required: [amount, fees, total]
      properties:
        amount: {$ref: '#/components/schemas/Amount'}
        fees: {$ref: '#/components/schemas/Amount'}
        taxes: {$ref: '#/components/schemas/Amount'}
        additionalCharges: {type: array, items: {$ref: '#/components/schemas/additionalChargesDetails'}}
        discountsApplied: {type: object, properties: {totalDiscount: {$ref: '#/components/schemas/Amount'}, promotionDetails: {type: array, items: {$ref: '#/components/schemas/PromotionDetail'}}}}
        total: {$ref: '#/components/schemas/Amount'}
    ReceiveAmountDetails:
      type: object
      required: [amount, fxRate, total]
      properties:
        amount: {$ref: '#/components/schemas/Amount'}
        fees: {$ref: '#/components/schemas/Amount'}
        taxes: {$ref: '#/components/schemas/Amount'}
        additionalCharges: {type: array, items: {$ref: '#/components/schemas/additionalChargesDetails'}}
        total: {$ref: '#/components/schemas/Amount'}
        fxRate: {type: number}
        fxRateEstimated: {type: boolean}
    PromotionDetail: {type: object, properties: {code: {type: string}, discount: {$ref: '#/components/schemas/Amount'}, errorCode: {type: string}, errorMessage: {type: string}}}
    TransactionQuoteDetails:
      type: object
      properties:
        transactionId: {type: string}
        serviceOptionCode: {type: string}
        serviceOptionName: {type: string}
        serviceOptionRoutingCode: {type: string}
        serviceOptionRoutingName: {type: string}
