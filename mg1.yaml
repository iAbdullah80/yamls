              schema: {$ref: '#/components/schemas/quoteResponseDisbursement'}
        '400': {$ref: '#/components/responses/BadRequestError'}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /disbursement/v1/transactions/{transactionId}:
    put:
      tags: [Disbursement]
      summary: Update a transaction
      description: Updates a quoted business disbursement with details and validates it.
      operationId: disbursementInstructPayoutTransactionUpdateAndValidate
      security:
      - OAuth2: [write]
      parameters:
      - {$ref: '#/components/parameters/ClientRequestIdOptional'}
      - in: path
        name: transactionId
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/ConsumerIPAddress'}
      requestBody:
        required: true
        content:
          application/json:
