x-terrapay-status-callback:
  direction: inbound-to-partner
  method: POST
  callbackUrl: Partner-configured; not defined by TerraPay
  requestSchema: '#/components/schemas/StatusNotificationRequest'
  acknowledgementSchema: '#/components/schemas/StatusNotificationAcknowledgement'
  source: https://developers.terrapay.com/docs/#status-notification
x-public-documentation-audit:
  checkedAtUTC: '2026-11-03T21:00:00Z'
  officialSource: https://developers.terrapay.com/docs/
  confirmedChangesFromUserSuppliedDraft:
  - POST quote endpoint uses /eig/gsmaV2/quotations
  - Corridor FX endpoints are /eig/gsmaV2/quotations/{prefundingCurrency} and 
    /eig/gsmaV3/quotations/{prefundingCurrency}
  - Transaction enquiry endpoint is GET /eig/gsma/transactions_v3/{transactionReference}
  - Ledger endpoint paths end in /balance_v1
  - Statements use reporting server :21228 /PartnerPortalReports/partnerstatements_v1, not 
    /eig/gsma/statements
  - Multi-part supporting document endpoint /eig/fileUpload
  - TerraPay Verify has independent host /tpverify/api/v1/verify and different response schema
  - Quotation v2 accepts scheme and creditParty instrumentType; up to 6 decimal places
  - V3 enquiry returns status and creditingOrganisationTransactionReference; use status for financial 
    finality
  - Ledger response includes account; statement fields are creationTime and modifiedTime, not timestamp
  - Status notification belongs to partner-hosted callback; only DTOs are provided here
  unresolved:
  - No authenticated UAT requests were available to test exact HTTP status codes, all corridor-specific 
    required fields, or available APIs for a particular partner account.
  - TerraPay Verify docs call password case-sensitive while general EIG docs call it case-insensitive.
  - TerraPay Verify wallet example omits instrumentType, although request parameter table marks it 
    mandatory.
  - Statements sample uses ledgerBookName, but its request parameter table documents only start/end.
  - V3 corridor description mentions country/scheme/vertical filters but does not list their query-parameter
    names.
  - File upload sample is DOCX while supported file types table lists PNG/JPG/PDF.
  - V3 vertical type uses verticalTypes in example but verticalType in documentation parameter table.
  - Transaction reference and KYC sample errors and cross-corridor conditional field rules require partner 
    UAT confirmation.
