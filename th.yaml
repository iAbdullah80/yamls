    UpdateRFIInformationRequest:
      type: object
      properties:
        information:
          $ref: '#/components/schemas/RFIProvidedInformation'
        comments:
          type: string
          maxLength: 256
      required:
      - information
    PossibleTransitions:
      type: object
      description: Map from five-digit status codes to their status names.
      additionalProperties:
        type: string
