          additionalProperties: {}
        beneficiary:
          type: object
          additionalProperties: {}
        sending_business:
          type: object
          additionalProperties: {}
        receiving_business:
          type: object
          additionalProperties: {}
        others:
          type: object
          additionalProperties: {}
    RFI:
      type: object
      description: The documents property is excluded from the list-RFIs response; retrieve an RFI by ID for attachments.
      properties:
        id:
          type: integer
          format: int64
        transaction_id:
          type: integer
          format: int64
        transaction_external_id:
          type: string
        status:
          type: string
        status_message:
          type: string
        creation_date:
          type: string
        expiration_date:
          type: string
        requested_information:
          $ref: '#/components/schemas/RFIRequestedInformation'
        requested_documents:
          type: array
