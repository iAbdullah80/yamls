                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/reports:
    get:
      tags:
      - Account
      operationId: listReports
      summary: List reports
      parameters:
      - $ref: '#/components/parameters/ReportFromDate'
      - $ref: '#/components/parameters/ReportToDate'
      - $ref: '#/components/parameters/ReportType'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: List of Report objects
          headers:
            X-Total:
              $ref: '#/components/headers/X-Total'
            X-Total-Pages:
              $ref: '#/components/headers/X-Total-Pages'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Next-Page:
              $ref: '#/components/headers/X-Next-Page'
            X-Prev-Page:
              $ref: '#/components/headers/X-Prev-Page'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/reports/{id}:
    get:
      tags:
      - Account
      operationId: getReport
      summary: Get report details
      parameters:
      - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/reports/{id}/files:
    get:
      tags:
      - Account
      operationId: listReportFiles
      summary: List files for a report
      parameters:
      - $ref: '#/components/parameters/ReportId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: List of ReportFile objects
          headers:
            X-Total:
              $ref: '#/components/headers/X-Total'
            X-Total-Pages:
              $ref: '#/components/headers/X-Total-Pages'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Next-Page:
              $ref: '#/components/headers/X-Next-Page'
            X-Prev-Page:
              $ref: '#/components/headers/X-Prev-Page'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportFile'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/reports/{report_id}/files/{id}:
    get:
      tags:
      - Account
      operationId: getReportFileDownloadUrl
      summary: Get signed report-file download URL
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportFileDownload'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/payers/{id}/{transaction_type}/credit-party-information:
    post:
      tags:
      - Credit Parties
      operationId: getCreditPartyInformation
      summary: Retrieve beneficiary or receiving-business account information
      description: Request depends on the payer configuration returned by GET /payers/{id}.
      parameters:
      - $ref: '#/components/parameters/PayerId'
      - $ref: '#/components/parameters/TransactionType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditPartyInformationRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditPartyInformationResponse'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/payers/{id}/{transaction_type}/credit-party-verification:
    post:
      tags:
      - Credit Parties
      operationId: verifyCreditParty
      summary: Verify receiving account availability
      description: Request depends on the payer configuration returned by GET /payers/{id}.
      parameters:
      - $ref: '#/components/parameters/PayerId'
      - $ref: '#/components/parameters/TransactionType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditPartyVerificationRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditPartyVerificationResponse'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/quotations:
    post:
      tags:
      - Quotations
      operationId: createQuotation
      summary: Create FX quotation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuotationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/quotations/{id}:
    get:
      tags:
      - Quotations
      operationId: getQuotation
      summary: Get quotation by Thunes ID
      parameters:
      - $ref: '#/components/parameters/QuotationId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/quotations/ext-{external_id}:
    get:
      tags:
      - Quotations
      operationId: getQuotationByExternalId
      summary: Get quotation by external ID
      parameters:
      - $ref: '#/components/parameters/ExternalId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/quotations/{id}/transactions:
    post:
      tags:
      - Transactions
      operationId: createTransactionFromQuotationId
      summary: Create transaction from quotation ID
      parameters:
      - $ref: '#/components/parameters/QuotationId'
      - $ref: '#/components/parameters/SimulatedTransactionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/quotations/ext-{external_id}/transactions:
    post:
      tags:
      - Transactions
      operationId: createTransactionFromQuotationExternalId
      summary: Create transaction from quotation external ID
      parameters:
      - $ref: '#/components/parameters/ExternalId'
      - $ref: '#/components/parameters/SimulatedTransactionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/transactions/{id}:
    get:
      tags:
      - Transactions
      operationId: getTransactionById
      summary: Get transaction by Thunes ID
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          headers:
            x-simulated-transaction:
              $ref: '#/components/headers/x-simulated-transaction'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/transactions/{id}/confirm:
    post:
      tags:
      - Transactions
      operationId: confirmTransactionById
      summary: Confirm transaction by Thunes ID
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/transactions/{id}/cancel:
    post:
      tags:
      - Transactions
      operationId: cancelTransactionById
      summary: Cancel eligible transaction by Thunes ID
      description: Cancellation is supported only in CREATED or CONFIRMED-WAITING-FOR-PICKUP status. Otherwise Thunes
        can return error code 1007014.
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/transactions/{id}/attachments:
    post:
      tags:
      - Transactions
      operationId: addTransactionAttachmentById
      summary: Upload transaction attachment by Thunes ID
      description: multipart/form-data; at most 3 files per transaction, maximum 8 MB each; generally upload before
        confirmation.
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 64
                type:
                  $ref: '#/components/schemas/AttachmentType'
                file:
                  type: string
                  format: binary
              required:
              - name
              - type
              - file
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionAttachment'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Transactions
      operationId: listTransactionAttachmentsById
      summary: List transaction attachments by Thunes ID
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: List of TransactionAttachment objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionAttachment'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/transactions/ext-{external_id}:
    get:
      tags:
      - Transactions
      operationId: getTransactionByExternalId
      summary: Get transaction by external ID
      parameters:
      - $ref: '#/components/parameters/ExternalId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          headers:
            x-simulated-transaction:
              $ref: '#/components/headers/x-simulated-transaction'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/transactions/ext-{external_id}/confirm:
    post:
      tags:
      - Transactions
      operationId: confirmTransactionByExternalId
      summary: Confirm transaction by external ID
      parameters:
      - $ref: '#/components/parameters/ExternalId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/transactions/ext-{external_id}/cancel:
    post:
      tags:
      - Transactions
      operationId: cancelTransactionByExternalId
      summary: Cancel eligible transaction by external ID
      description: Cancellation is supported only in CREATED or CONFIRMED-WAITING-FOR-PICKUP status. Otherwise Thunes
        can return error code 1007014.
      parameters:
      - $ref: '#/components/parameters/ExternalId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/transactions/ext-{external_id}/attachments:
    post:
      tags:
      - Transactions
      operationId: addTransactionAttachmentByExternalId
      summary: Upload transaction attachment by external ID
      description: multipart/form-data; at most 3 files per transaction, maximum 8 MB each; generally upload before
        confirmation.
      parameters:
      - $ref: '#/components/parameters/ExternalId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 64
                type:
                  $ref: '#/components/schemas/AttachmentType'
                file:
                  type: string
                  format: binary
              required:
              - name
              - type
              - file
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionAttachment'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Transactions
      operationId: listTransactionAttachmentsByExternalId
      summary: List transaction attachments by external ID
      parameters:
      - $ref: '#/components/parameters/ExternalId'
      responses:
        '200':
          description: List of TransactionAttachment objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionAttachment'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/simulation/transactions/{id}/possible-transitions:
    get:
      tags:
      - Simulation
      operationId: listPossibleSimulationTransitions
      summary: List allowed simulated status changes
      description: For pre-production/testing only.
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PossibleTransitions'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/simulation/transactions/{id}/{status_name}:
    get:
      tags:
      - Simulation
      operationId: simulateTransactionStatusById
      summary: Simulate transaction status change by Thunes ID
      description: For pre-production/testing only. This GET request intentionally mutates simulated state, as documented
        by Thunes.
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      - $ref: '#/components/parameters/SimulationStatusName'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/simulation/transactions/ext-{external_id}/{status_name}:
    get:
      tags:
      - Simulation
      operationId: simulateTransactionStatusByExternalId
      summary: Simulate transaction status change by external ID
      description: For pre-production/testing only. This GET request intentionally mutates simulated state, as documented
        by Thunes.
      parameters:
      - $ref: '#/components/parameters/ExternalId'
      - $ref: '#/components/parameters/SimulationStatusName'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/rfis:
    get:
      tags:
      - RFIs
      operationId: listRFIs
      summary: List requests for information
      parameters:
      - $ref: '#/components/parameters/RFIFromDate'
      - $ref: '#/components/parameters/RFIToDate'
      - $ref: '#/components/parameters/RFILimit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: List of RFI objects
          headers:
            X-Next-Cursor:
              $ref: '#/components/headers/X-Next-Cursor'
            X-Next-Url:
              $ref: '#/components/headers/X-Next-Url'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RFI'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/rfis/{id}:
    get:
      tags:
      - RFIs
      operationId: getRFI
      summary: Retrieve RFI by ID
      parameters:
      - $ref: '#/components/parameters/RFIId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RFI'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/rfis/{id}/attachments:
    post:
      tags:
      - RFIs
      operationId: addRFIAttachment
      summary: Upload requested RFI attachment
      description: multipart/form-data; max 8 MB per attachment. The number of files cannot exceed the requested
        documents.
      parameters:
      - $ref: '#/components/parameters/RFIId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 64
                type:
                  $ref: '#/components/schemas/AttachmentType'
                file:
                  type: string
                  format: binary
              required:
              - name
              - type
              - file
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RFIAttachment'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/rfis/{id}/information:
    patch:
      tags:
      - RFIs
      operationId: updateRFIInformation
      summary: Provide information for RFI
      parameters:
      - $ref: '#/components/parameters/RFIId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRFIInformationRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RFI'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/rfis/{id}/submit:
    post:
      tags:
      - RFIs
      operationId: submitRFI
      summary: Submit RFI for review
      parameters:
      - $ref: '#/components/parameters/RFIId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RFI'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Username is Thunes API key; password is Thunes API secret.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
      description: Page number (1-based).
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 1
        maximum: 100
      description: Items per page.
    CountryIsoCode:
      name: country_iso_code
      in: query
      required: false
      schema:
        type: string
        maxLength: 3
    Currency:
      name: currency
      in: query
      required: false
      schema:
        type: string
        maxLength: 3
    PayerId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
    QuotationId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TransactionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ExternalId:
      name: external_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    BalanceId:
      name: balance_id
      in: path
      required: true
      schema:
        type: integer
        format: int32
    ReportId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    FileId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RFIId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TransactionType:
      name: transaction_type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TransactionType'
    SimulationStatusName:
      name: status_name
      in: path
      required: true
      schema:
        type: string
      description: Target status name (case-insensitive).
    SwiftBicCode:
      name: swift_bic_code
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    MovementFromDate:
      name: from_date
      in: query
      required: true
      schema:
        type: string
      description: Start time; documented requests use ISO 8601 timestamps with Z.
    MovementToDate:
      name: to_date
      in: query
      required: true
      schema:
        type: string
      description: End time, within 24 hours of from_date.
    MovementLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 100
        maximum: 200
    RFIFromDate:
      name: from_date
      in: query
      required: true
      schema:
        type: string
      description: Start time in documented timestamp format.
    RFIToDate:
      name: to_date
      in: query
      required: true
      schema:
        type: string
      description: End time in documented timestamp format.
    RFILimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 50
        maximum: 100
    ReportFromDate:
      name: from_date
      in: query
      required: false
      schema:
        type: string
    ReportToDate:
      name: to_date
      in: query
      required: false
      schema:
        type: string
    ReportType:
      name: report_type
      in: query
      required: false
      schema:
        type: string
    ServiceId:
      name: service_id
      in: query
      required: false
      schema:
        type: integer
        format: int32
    SimulatedTransactionHeader:
      name: x-simulated-transaction
      in: header
      required: false
      schema:
        type: boolean
      description: Set to true when creating a transaction in pre-production to use transaction simulation (where
        enabled).
  headers:
    X-Total:
      description: Thunes pagination header
      schema:
        type: integer
        format: int64
    X-Total-Pages:
      description: Thunes pagination header
      schema:
        type: integer
        format: int32
    X-Per-Page:
      description: Thunes pagination header
      schema:
        type: integer
        format: int32
    X-Page:
      description: Thunes pagination header
      schema:
        type: integer
        format: int32
    X-Next-Page:
      description: Thunes pagination header
      schema:
        type: integer
        format: int32
    X-Prev-Page:
      description: Thunes pagination header
      schema:
        type: integer
        format: int32
    X-Next-Cursor:
      description: Cursor pagination header
      schema:
        type: string
    X-Next-Url:
      description: Cursor pagination header
      schema:
        type: string
    x-simulated-transaction:
      description: Present as true for simulated transactions.
      schema:
        type: boolean
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
      required:
      - errors
    PingResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - up
      required:
      - status
    Service:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    Country:
      type: object
      properties:
        iso_code:
          type: string
          maxLength: 3
        name:
          type: string
    PayerSummary:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        currency:
          type: string
          maxLength: 3
        country_iso_code:
          type: string
          maxLength: 3
        service:
          $ref: '#/components/schemas/Service'
    RequiredCreditPartyInformation:
      type: object
      properties:
        credit_party_identifiers_accepted:
          type: array
          items:
            type: array
            items:
              type: string
          description: Accepted alternative sets of account-identifier keys; first set is preferred.
    RequiredCreditPartyVerification:
      type: object
      properties:
        credit_party_identifiers_accepted:
          type: array
          items:
            type: array
            items:
              type: string
          description: Accepted alternative sets of identifier keys.
        required_receiving_entity_fields:
          type: array
          items:
            type: array
            items:
              type: string
          description: Required alternatives for the receiving entity.
    TransactionTypeInformation:
      type: object
      properties:
        minimum_transaction_amount:
          type: number
          nullable: true
        maximum_transaction_amount:
          type: number
          nullable: true
        credit_party_identifiers_accepted:
          type: array
          items:
            type: array
            items:
              type: string
          description: Alternative sets of identifiers; select one complete set and prefer the first.
        required_sending_entity_fields:
          type: array
          items:
            type: array
            items:
              type: string
          description: Payer-specific required field combinations.
        required_receiving_entity_fields:
          type: array
          items:
            type: array
            items:
              type: string
          description: Payer-specific required field combinations.
        required_documents:
          type: array
          items:
            type: array
            items:
              type: string
          description: Payer-specific required document combinations.
        credit_party_information:
          $ref: '#/components/schemas/RequiredCreditPartyInformation'
        credit_party_verification:
          $ref: '#/components/schemas/RequiredCreditPartyVerification'
        purpose_of_remittance_values_accepted:
          type: array
          items:
            type: string
          description: Empty array means every purpose is accepted.
    Payer:
      type: object
      description: Payer configuration determines required entity fields, accepted credit-party identifier combinations
        and limits.
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        precision:
          type: integer
          format: int32
        increment:
          type: number
        currency:
          type: string
          maxLength: 3
        country_iso_code:
          type: string
          maxLength: 3
        service:
          $ref: '#/components/schemas/Service'
        transaction_types:
          type: object
          properties:
            C2C:
              $ref: '#/components/schemas/TransactionTypeInformation'
            C2B:
              $ref: '#/components/schemas/TransactionTypeInformation'
            B2C:
              $ref: '#/components/schemas/TransactionTypeInformation'
            B2B:
              $ref: '#/components/schemas/TransactionTypeInformation'
        minimum_transaction_amount:
          type: number
          nullable: true
        maximum_transaction_amount:
          type: number
          nullable: true
    Rate:
