          type: string
          maxLength: 64
        email:
          type: string
          maxLength: 64
        registration_number:
          type: string
          maxLength: 64
        tax_id:
          type: string
          maxLength: 64
        date_of_incorporation:
          type: string
          maxLength: 64
        representative_lastname:
          type: string
          maxLength: 64
        representative_lastname2:
          type: string
          maxLength: 64
        representative_firstname:
          type: string
          maxLength: 64
        representative_middlename:
          type: string
          maxLength: 64
        representative_nativename:
          type: string
          maxLength: 64
        representative_id_type:
          type: string
          maxLength: 64
        representative_id_country_iso_code:
          type: string
          maxLength: 3
        representative_id_number:
          type: string
          maxLength: 64
        representative_id_delivery_date:
          type: string
          maxLength: 64
        representative_id_expiration_date:
          type: string
          maxLength: 64
    Source:
      type: object
      properties:
        country_iso_code:
          type: string
          maxLength: 3
        currency:
          type: string
          description: ISO 4217 currency or supported stablecoin USDT/USDC.
        amount:
          type: number
          description: Required in SOURCE_AMOUNT quotations; omit or use null otherwise.
          nullable: true
      required:
      - country_iso_code
      - currency
    Destination:
      type: object
      properties:
        currency:
          type: string
          description: ISO 4217 currency or supported stablecoin USDT/USDC.
        amount:
          type: number
          description: Required in DESTINATION_AMOUNT quotations; omit or use null otherwise.
          nullable: true
      required:
      - currency
    MoneyAmount:
      type: object
      properties:
        currency:
          type: string
        amount:
          type: number
    TransactionType:
      type: string
      enum:
      - C2C
      - C2B
      - B2C
      - B2B
    QuotationMode:
      type: string
      enum:
      - SOURCE_AMOUNT
      - DESTINATION_AMOUNT
    CreateQuotationRequest:
      type: object
      description: SOURCE_AMOUNT requires source.amount; DESTINATION_AMOUNT requires destination.amount. Set the
        other amount to null or omit it.
      properties:
        external_id:
          type: string
          maxLength: 64
        payer_id:
          type: integer
          format: int32
        mode:
          $ref: '#/components/schemas/QuotationMode'
        transaction_type:
          $ref: '#/components/schemas/TransactionType'
        source:
          $ref: '#/components/schemas/Source'
        destination:
          $ref: '#/components/schemas/Destination'
      required:
      - external_id
      - payer_id
      - mode
      - transaction_type
      - source
      - destination
    Quotation:
      type: object
      description: Datetime values are left as strings because documented examples mix timestamps with and without
        timezone offsets.
      properties:
        id:
          type: integer
          format: int64
        external_id:
          type: string
          maxLength: 64
        payer:
          $ref: '#/components/schemas/PayerSummary'
        mode:
          $ref: '#/components/schemas/QuotationMode'
        transaction_type:
          $ref: '#/components/schemas/TransactionType'
        source:
          $ref: '#/components/schemas/Source'
        destination:
          $ref: '#/components/schemas/Destination'
        sent_amount:
          $ref: '#/components/schemas/MoneyAmount'
        wholesale_fx_rate:
          type: number
        fee:
          $ref: '#/components/schemas/MoneyAmount'
        creation_date:
          type: string
        expiration_date:
          type: string
    CreateTransactionRequest:
      type: object
      description: Based on quotation type, include sender+beneficiary (C2C), sender+receiving_business (C2B), sending_business+beneficiary
        (B2C), or sending_business+receiving_business (B2B). document_reference_number is also mandatory for B2B.
        Other entity fields vary by payer.
      properties:
        credit_party_identifier:
          $ref: '#/components/schemas/CreditPartyIdentifier'
        retail_rate:
          type: number
        retail_fee:
          type: number
        retail_fee_currency:
          type: string
          maxLength: 3
        sender:
          $ref: '#/components/schemas/Sender'
        beneficiary:
          $ref: '#/components/schemas/Beneficiary'
        sending_business:
          $ref: '#/components/schemas/SendingBusiness'
        receiving_business:
          $ref: '#/components/schemas/ReceivingBusiness'
        external_id:
          type: string
          maxLength: 64
        external_code:
          type: string
          maxLength: 64
        callback_url:
          type: string
        purpose_of_remittance:
          type: string
          maxLength: 64
        document_reference_number:
          type: string
          maxLength: 64
        additional_information_1:
          type: string
          maxLength: 64
        additional_information_2:
          type: string
          maxLength: 64
        additional_information_3:
          type: string
          maxLength: 64
        reference:
          type: string
          maxLength: 16
      required:
      - credit_party_identifier
      - external_id
      - purpose_of_remittance
    Transaction:
      type: object
      description: The same shape is used for transaction GET results, confirmation/cancellation responses and callbacks.
        Fields may be null or absent based on transaction type and payer.
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          maxLength: 5
          description: Five-digit status code; kept as string because Thunes may add codes.
        status_message:
          type: string
          maxLength: 64
        status_class:
          type: string
          maxLength: 1
        status_class_message:
          type: string
          maxLength: 64
        external_id:
          type: string
          maxLength: 64
        external_code:
          type: string
          maxLength: 64
        transaction_type:
          $ref: '#/components/schemas/TransactionType'
        payer_transaction_reference:
          type: string
          maxLength: 64
        payer_transaction_code:
          type: string
          maxLength: 64
        creation_date:
          type: string
        expiration_date:
          type: string
        credit_party_identifier:
          $ref: '#/components/schemas/CreditPartyIdentifier'
        source:
          $ref: '#/components/schemas/Source'
        destination:
          $ref: '#/components/schemas/Destination'
        payer:
          $ref: '#/components/schemas/PayerSummary'
        sender:
          $ref: '#/components/schemas/Sender'
        beneficiary:
          $ref: '#/components/schemas/Beneficiary'
        sending_business:
          $ref: '#/components/schemas/SendingBusiness'
        receiving_business:
          $ref: '#/components/schemas/ReceivingBusiness'
        callback_url:
          type: string
        sent_amount:
          $ref: '#/components/schemas/MoneyAmount'
        wholesale_fx_rate:
          type: number
        retail_rate:
          type: number
          nullable: true
        retail_fee:
          type: number
          nullable: true
        retail_fee_currency:
          type: string
          maxLength: 3
        fee:
          $ref: '#/components/schemas/MoneyAmount'
        purpose_of_remittance:
          type: string
          maxLength: 64
        document_reference_number:
          type: string
          maxLength: 64
        additional_information_1:
          type: string
          maxLength: 64
        additional_information_2:
          type: string
          maxLength: 64
        additional_information_3:
          type: string
          maxLength: 64
        reference:
          type: string
    CreditPartyInformationRequest:
      type: object
      properties:
        credit_party_identifier:
          $ref: '#/components/schemas/CreditPartyIdentifier'
      required:
      - credit_party_identifier
    CreditPartyInformationResponse:
      type: object
      description: Thunes documentation example returns an id and a beneficiary wrapper; the prose also describes
        the returned beneficiary/business object. Preserve unrecognized fields in runtime JSON mapping.
      properties:
        id:
          type: integer
          format: int64
        beneficiary:
          $ref: '#/components/schemas/Beneficiary'
        receiving_business:
          $ref: '#/components/schemas/ReceivingBusiness'
    CreditPartyVerificationRequest:
      type: object
      description: Beneficiary/receiving_business fields may be required depending on the payer.
      properties:
        credit_party_identifier:
          $ref: '#/components/schemas/CreditPartyIdentifier'
        beneficiary:
          $ref: '#/components/schemas/Beneficiary'
        receiving_business:
          $ref: '#/components/schemas/ReceivingBusiness'
      required:
      - credit_party_identifier
    CreditPartyVerificationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        account_status:
          type: string
          description: Documented values include AVAILABLE, UNREGISTERED and UNAVAILABLE variants.
      required:
      - id
      - account_status
    AttachmentType:
      type: string
      description: 'Documented values: invoice, purchase_order, delivery_slip, contract, customs_declaration, bill_of_lading,
        others, identification_documents, proof_of_address, proof_of_source_of_funds, registration_documents. Kept
        as string to tolerate future additive attachment types.'
    TransactionAttachment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        content_type:
          type: string
        name:
          type: string
        transaction_id:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/AttachmentType'
    RFIAttachment:
      type: object
