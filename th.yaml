# Thunes Money Transfer API v2 — client-oriented, non-official OpenAPI transcription.
# Source: https://docs.thunes.com/money-transfer/v2/
# Configure API host and HTTP Basic credentials in your generated client.
openapi: 3.0.3
info:
  title: Thunes Money Transfer API v2
  version: '2.0'
  description: Client-oriented OpenAPI specification transcribed from the official Thunes Money Transfer v2 reference
    (https://docs.thunes.com/money-transfer/v2/). This is an independently authored specification, NOT an official
    Thunes-published OpenAPI file. Configure the generated client base URL to the production or pre-production Thunes
    host supplied for your account. All system IDs use 64-bit integers; monetary decimal numbers should use java.math.BigDecimal.
    Respect payer-specific required fields discovered via GET /payers/{id}. Do not assume future response status
    codes or additional fields are exhaustive.
servers:
- url: /
  description: Relative API root. Set your generated client host/base URL from your Thunes account details; paths
    include /v2/money-transfer or /v2/simulation.
security:
- basicAuth: []
tags:
- name: Connectivity
- name: Discovery
- name: Account
- name: Credit Parties
- name: Quotations
- name: Transactions
- name: Simulation
- name: RFIs
paths:
  /ping:
    get:
      tags:
      - Connectivity
      operationId: ping
      summary: Check API health
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/services:
    get:
      tags:
      - Discovery
      operationId: listServices
      summary: List available services
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/CountryIsoCode'
      responses:
        '200':
          description: List of Service objects
          headers:
            X-Total:
              $ref: '#/components/headers/X-Total'
            X-Total-Pages:
              $ref: '#/components/headers/X-Total-Pages'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Next-Page:
              $ref: '#/components/headers/X-Next-Page'
            X-Prev-Page:
              $ref: '#/components/headers/X-Prev-Page'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/payers:
    get:
      tags:
      - Discovery
      operationId: listPayers
      summary: List available payers
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/CountryIsoCode'
      - $ref: '#/components/parameters/Currency'
      responses:
        '200':
          description: List of Payer objects
          headers:
            X-Total:
              $ref: '#/components/headers/X-Total'
            X-Total-Pages:
              $ref: '#/components/headers/X-Total-Pages'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Next-Page:
              $ref: '#/components/headers/X-Next-Page'
            X-Prev-Page:
              $ref: '#/components/headers/X-Prev-Page'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payer'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/payers/{id}:
    get:
      tags:
      - Discovery
      operationId: getPayer
      summary: Get payer details
      parameters:
      - $ref: '#/components/parameters/PayerId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payer'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/payers/{id}/rates:
    get:
      tags:
      - Discovery
      operationId: getPayerRates
      summary: Get payer FX rate bands
      parameters:
      - $ref: '#/components/parameters/PayerId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayerRates'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/countries:
    get:
      tags:
      - Discovery
      operationId: listCountries
      summary: List available countries
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: List of Country objects
          headers:
            X-Total:
              $ref: '#/components/headers/X-Total'
            X-Total-Pages:
              $ref: '#/components/headers/X-Total-Pages'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Next-Page:
              $ref: '#/components/headers/X-Next-Page'
            X-Prev-Page:
              $ref: '#/components/headers/X-Prev-Page'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/lookups/BIC/{swift_bic_code}:
    get:
      tags:
      - Discovery
      operationId: lookupPayersByBic
      summary: Look up payer IDs by BIC
      parameters:
      - $ref: '#/components/parameters/SwiftBicCode'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: List of PayerIdLookupResult objects
          headers:
            X-Total:
              $ref: '#/components/headers/X-Total'
            X-Total-Pages:
              $ref: '#/components/headers/X-Total-Pages'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Next-Page:
              $ref: '#/components/headers/X-Next-Page'
            X-Prev-Page:
              $ref: '#/components/headers/X-Prev-Page'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PayerIdLookupResult'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/balances:
    get:
      tags:
      - Account
      operationId: listBalances
      summary: List account balances
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: List of Balance objects
          headers:
            X-Total:
              $ref: '#/components/headers/X-Total'
            X-Total-Pages:
              $ref: '#/components/headers/X-Total-Pages'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Next-Page:
              $ref: '#/components/headers/X-Next-Page'
            X-Prev-Page:
              $ref: '#/components/headers/X-Prev-Page'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Balance'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/balances/{balance_id}/movements:
    get:
      tags:
      - Account
      operationId: listBalanceMovements
      summary: List balance movements
      parameters:
      - $ref: '#/components/parameters/BalanceId'
      - $ref: '#/components/parameters/MovementFromDate'
      - $ref: '#/components/parameters/MovementToDate'
      - $ref: '#/components/parameters/MovementLimit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: List of BalanceMovement objects
          headers:
            X-Next-Cursor:
              $ref: '#/components/headers/X-Next-Cursor'
            X-Next-Url:
              $ref: '#/components/headers/X-Next-Url'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BalanceMovement'
        default:
          description: Thunes error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/money-transfer/balances/{balance_id}/topup_instructions:
    get:
      tags:
      - Account
      operationId: getBalanceTopupInstructions
      summary: Get balance top-up instructions
      parameters:
      - $ref: '#/components/parameters/BalanceId'
      responses:
        '200':
          description: Successful response
          content:
