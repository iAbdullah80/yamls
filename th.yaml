          format: int64
        type:
          $ref: '#/components/schemas/AttachmentType'
    RFIRequestedInformation:
      type: object
      properties:
        sender:
          type: array
          items:
            type: string
        beneficiary:
          type: array
          items:
            type: string
        sending_business:
          type: array
          items:
            type: string
        receiving_business:
          type: array
          items:
            type: string
        others:
          type: array
          items:
            type: string
    RFIProvidedInformation:
