openapi: 3.1.0
info:
  title: Western Union Mass Payments - UNVERIFIED Third-Party Reference
  version: 0.1.0-reference
  description: |-
    NON-PRODUCTION REFERENCE ONLY. This document is NOT an official Western Union
    specification and has NOT been validated against a Western Union API or
    authenticated Western Union developer documentation.

    The operation paths and data model are a transcription/adaptation of the
    independent API Evangelist / APIs.io Western Union Mass Payments listings,
    accessed on 2026-11-04. These listings explicitly identify their author as
    independent of Western Union. Official Western Union material confirms
    partner API integration exists, but does not publish these REST contracts.

    IMPORTANT: Western Union's consumer/P2P remittance partnership integration
    may be DIFFERENT from the batch-oriented Mass Payments reference here.
    Do not use for production or send funds using these operations without an
    official partner-specific API contract and UAT verification.

    Missing and NOT invented: commit/submit batch, disbursement initiation
    outside batch, corridor discovery, KYC requirements, payout method lookup,
    cancellation/reversal, errors, idempotency, webhooks, actual base URLs,
    and production auth/certificate requirements.
  x-source-confidence: unverified-independent-third-party
  x-validation-scope: OpenAPI structure, syntax, references and path parameters only
  x-required-before-production:
    - Obtain Western Union partner API specification and environment URLs.
    - Confirm whether contract is P2P remittance, hosted, white-label or mass payments.
    - Confirm every operation path, HTTP method, request field, response field and requiredness.
    - Confirm amount units, currency code conventions, credentials, certificate use and idempotency.
    - Validate generated Java client against Western Union UAT and authenticated examples.
externalDocs:
  description: Independent source catalog (not Western Union API documentation)
  url: https://apis.io/providers/western-union/
servers:
  - url: https://{partnerHost}
    description: Placeholder only; replace with exact host supplied by Western Union.
    variables:
      partnerHost:
        default: western-union-host-not-configured.invalid
        description: Official partner-specific hostname; NEVER assume a third-party published host is correct.
security:
  - PartnerMtlsUnconfirmed: []
tags:
  - name: Health
  - name: Customers
  - name: Balances
  - name: Batches
  - name: Payments
  - name: Quotes
  - name: Orders
paths:
  /Ping:
    get:
      tags: [Health]
      operationId: ping
      summary: Health check (UNVERIFIED)
      x-source-verification: third-party-only
      responses:
        '200':
          description: Reported health response; unverified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '401': {description: Authentication failed (third-party claim).}
  /customers/{clientId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Get customer (UNVERIFIED)
      x-source-verification: third-party-only
      responses:
        '200':
          description: Partner customer details (third-party claim).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        '401': {description: Unauthorized (third-party claim).}
        '404': {description: Customer not found (third-party claim).}
  /HoldingBalance/{clientId}/{currencyCode}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/CurrencyCode'
    get:
      tags: [Balances]
      operationId: getHoldingBalance
      summary: Get holding balance (UNVERIFIED)
      x-source-verification: third-party-only
      responses:
        '200':
          description: Reported holding balance.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HoldingBalanceResponse'}
        '401': {description: Unauthorized (third-party claim).}
        '404': {description: Client or currency not found (third-party claim).}
  /customers/{clientId}/batches/{batchId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/BatchId'
    get:
      tags: [Batches]
      operationId: getBatch
      summary: Get payment batch (UNVERIFIED)
      x-source-verification: third-party-only
      responses:
        '200':
          description: Batch details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchResponse'}
        '404': {description: Batch not found (third-party claim).}
    put:
      tags: [Batches]
      operationId: createBatch
      summary: Create payment batch (UNVERIFIED)
      x-source-verification: third-party-only
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateBatchRequest'}
      responses:
        '200':
          description: Batch created (third-party claim).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchResponse'}
        '400': {description: Invalid request (third-party claim).}
    delete:
      tags: [Batches]
      operationId: deleteBatch
      summary: Delete uncommitted batch (UNVERIFIED)
      x-source-verification: third-party-only
      responses:
        '204': {description: Batch deleted (third-party claim).}
        '404': {description: Batch not found (third-party claim).}
  /customers/{clientId}/batches/{batchId}/payments:
    parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/BatchId'
    get:
      tags: [Payments]
      operationId: listPayments
      summary: List payments in a batch (UNVERIFIED)
      x-source-verification: third-party-only
      responses:
        '200':
          description: Payment list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentsResponse'}
        '404': {description: Batch not found (third-party claim).}
    post:
      tags: [Payments]
      operationId: createPayment
      summary: Add payment to batch (UNVERIFIED)
      x-source-verification: third-party-only
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentRequest'}
      responses:
        '201':
          description: Payment added (third-party claim).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentResponse'}
        '400': {description: Invalid payment data (third-party claim).}
  /customers/{clientId}/batches/{batchId}/payments/{paymentId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/BatchId'
      - $ref: '#/components/parameters/PaymentId'
    get:
      tags: [Payments]
      operationId: getPayment
      summary: Get payment (UNVERIFIED)
      x-source-verification: third-party-only
      responses:
        '200':
          description: Payment details and status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentResponse'}
        '404': {description: Payment not found (third-party claim).}
  /customers/{clientId}/quotes:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    post:
      tags: [Quotes]
      operationId: createQuote
      summary: Create FX quote (UNVERIFIED)
      x-source-verification: third-party-only
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuoteRequest'}
      responses:
        '201':
          description: Quote created (third-party claim).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuoteResponse'}
        '400': {description: Invalid quote request (third-party claim).}
  /customers/{clientId}/orders:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List orders (UNVERIFIED)
      x-source-verification: third-party-only
      responses:
        '200':
          description: Payment orders.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrdersResponse'}
  /customers/{clientId}/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get order (UNVERIFIED)
      x-source-verification: third-party-only
      responses:
        '200':
          description: Order details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResponse'}
        '404': {description: Order not found (third-party claim).}
components:
  securitySchemes:
    PartnerMtlsUnconfirmed:
      type: mutualTLS
      description: |-
        mTLS is claimed by the independent reference only; verify requirements
        and certificate handling with Western Union onboarding before use.
  parameters:
    ClientId:
      name: clientId
      in: path
      required: true
      description: Western Union partner client identifier (third-party claim).
      schema: {type: string}
    BatchId:
      name: batchId
      in: path
      required: true
      schema: {type: string}
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: {type: string}
    OrderId:
      name: orderId
      in: path
      required: true
      schema: {type: string}
    CurrencyCode:
      name: currencyCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Z]{3}$'
  schemas:
    PingResponse:
      type: object
      properties:
        status: {type: string}
    Customer:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        status: {type: string, description: Values reported by the third-party catalog include active/suspended/pending.}
        settlementCurrency: {type: string}
        createdOn: {type: string, format: date-time}
        lastUpdatedOn: {type: string, format: date-time}
    HoldingBalanceResponse:
      type: object
      properties:
        clientId: {type: string}
        currencyCode: {type: string}
        balance: {$ref: '#/components/schemas/HoldingBalance'}
    HoldingBalance:
      type: object
      properties:
        currencyCode: {type: string}
        amount: {type: number, description: Numeric units are NOT confirmed by Western Union.}
    CreateBatchRequest:
      type: object
      required: [reference]
      properties:
        reference: {type: string, description: Partner internal reference (third-party claim).}
    BatchResponse:
      type: object
      required: [id, reference, createdOn, numberOfReceivedPayments, numberOfAcceptedPayments]
      properties:
        id: {type: string}
        reference: {type: string}
        createdOn: {type: string, format: date-time}
        lastUpdatedOn: {type: string, format: date-time}
        numberOfReceivedPayments: {type: integer}
        numberOfAcceptedPayments: {type: integer}
        aggregateAmounts:
          type: array
          items: {$ref: '#/components/schemas/AggregateAmount'}
    AggregateAmount:
      type: object
      properties:
        currencyCode: {type: string}
        totalAmount: {type: number, description: Units unknown; third-party catalog presents a JSON number.}
    PaymentRequest:
      type: object
      description: Third-party model; required fields and payout instruments may differ in the actual partner contract.
      required: [amount, currencyCode, beneficiary, bankAccount]
      properties:
        partnerReference: {type: string}
        amount: {type: integer, format: int64, description: Claimed to be in minor units; Western Union verification REQUIRED.}
        currencyCode: {type: string}
        settlementCurrency: {type: string}
        paymentMethod: {type: string, description: Third-party examples include bankTransfer, wireTransfer, swift.}
        purposeOfPayment: {type: string}
        remittanceType: {type: string}
        isFixedAmountInSettlementCurrency: {type: boolean}
        beneficiary: {$ref: '#/components/schemas/Beneficiary'}
        bankAccount: {$ref: '#/components/schemas/BankAccount'}
        thirdPartyRemitter: {$ref: '#/components/schemas/ThirdPartyRemitter'}
    PaymentResponse:
      type: object
      properties:
        id: {type: string}
        customerId: {type: string}
        status: {type: string, description: Third-party statuses are not authoritative or exhaustive.}
        errorCode: {type: string}
        partnerReference: {type: string}
        paymentReference: {type: string}
        createdOn: {type: string, format: date-time}
        lastUpdatedOn: {type: string, format: date-time}
        paymentMethod: {type: string}
        amount: {type: integer, format: int64}
        currencyCode: {type: string}
        settlementAmount: {type: integer, format: int64}
        settlementCurrencyCode: {type: string}
        chargeType: {type: string}
        amountReturned: {type: number, description: Units unverified.}
        amountReturnedCurrency: {type: string}
        purposeOfPayment: {type: string}
        remittanceType: {type: string}
        beneficiary: {$ref: '#/components/schemas/Beneficiary'}
        bankAccount: {$ref: '#/components/schemas/BankAccount'}
    PaymentsResponse:
      type: object
      properties:
        payments:
          type: array
          items: {$ref: '#/components/schemas/PaymentResponse'}
    Beneficiary:
      type: object
      properties:
        id: {type: string}
        firstName: {type: string}
        middleName: {type: string}
        lastName: {type: string}
        email: {type: string, format: email}
        phoneNumber: {type: string}
        cellNumber: {type: string}
        dateOfBirth: {type: string, format: date}
        gender: {type: string}
        type: {type: string, description: Third-party categories include individual and business.}
        businessName: {type: string}
        businessRegistrationNumber: {type: string}
        businessRegistrationCountry: {type: string}
        taxId: {type: string}
        address: {$ref: '#/components/schemas/Address'}
    BankAccount:
      type: object
      properties:
        id: {type: string}
        accountNumber: {type: string}
        accountType: {type: string}
        bankName: {type: string}
        bankCode: {type: string, description: Third-party catalog describes SWIFT/BIC.}
        bankBranchCode: {type: string}
        bankBranchName: {type: string}
        address: {$ref: '#/components/schemas/Address'}
    ThirdPartyRemitter:
      type: object
      properties:
        firstName: {type: string}
        lastName: {type: string}
        businessName: {type: string}
        address: {$ref: '#/components/schemas/Address'}
    Address:
      type: object
      properties:
        line1: {type: string}
        line2: {type: string}
        line3: {type: string}
        city: {type: string}
        stateOrProv: {type: string}
        zipOrPostal: {type: string}
        countryCode: {type: string}
    QuoteRequest:
      type: object
      required: [tradeCurrency, settlementCurrency, tradeAmount]
      properties:
        tradeCurrency: {type: string}
        settlementCurrency: {type: string}
        tradeAmount: {type: integer, format: int64, description: Claimed minor units, unverified by Western Union.}
        partnerReference: {type: string}
    QuoteResponse:
      type: object
      properties:
        id: {type: string}
        customerId: {type: string}
        partnerReference: {type: string}
        status: {type: string}
        createdOn: {type: string, format: date-time}
        lastUpdatedOn: {type: string, format: date-time}
        expirationIntervalInSec: {type: integer}
        quotedItems: {$ref: '#/components/schemas/QuotedItem'}
    QuotedItem:
      type: object
      properties:
        isDirectRate: {type: boolean}
        rate: {type: number}
        rateInverted: {type: number}
        decimalsDirect: {type: integer}
        decimalsIndirect: {type: integer}
        tradeAmount: {type: integer, format: int64}
        settlementAmount: {type: integer, format: int64}
        tradeCurrency: {type: string}
        settlementCurrency: {type: string}
    OrderResponse:
      type: object
      properties:
        id: {type: string}
        customerId: {type: string}
        status: {type: string}
        settlementCurrency: {type: string}
        partnerReference: {type: string}
        createdOn: {type: string, format: date-time}
        lastUpdatedOn: {type: string, format: date-time}
        errorCode: {type: string}
    OrdersResponse:
      type: object
      properties:
        orders:
          type: array
          items: {$ref: '#/components/schemas/OrderResponse'}
x-source-records:
  - provider: Western Union (official)
    url: https://corporate.westernunion.com/wp-content/uploads/2021/10/Western-Union-P2P-CoBranded.pdf
    verification: Confirms partner P2P API integration exists, NOT paths or schemas.
  - provider: Western Union (official)
    url: https://ir.westernunion.com/news/archived-press-releases/press-release-details/2015/Western-Union-Introduces-WU-Connect-Platform-Expanding-Cross-Border-Money-Transfer-via-Mobile-and-Social-Media/default.aspx
    verification: Confirms API-based WU Connect, NOT this Mass Payments REST contract.
  - provider: API Evangelist / APIs.io (independent)
    url: https://apis.io/providers/western-union/
    verification: Source of ALL operation/path/schema claims in this draft. NOT verified by Western Union.
  - provider: Western Union PSD2 via Salt Edge
    url: https://wu-priora.saltedge.com/
    verification: Different PSD2/Open Banking product. Explicitly excluded from this Mass Payments draft.
