# MoneyGram unified OpenAPI reference composition. Uses remote $refs to official MoneyGram YAMLs.
# Source commit: 821daa435f5bf919763b0427b207d9ee480e6277 (2025-08-14).
# Online resolution is required. For fully self-contained generation, use MoneyGram's source YAMLs individually.
openapi: 3.0.3
info:
  title: MoneyGram APIs - Unified Client Entry Point
  version: 1.0.0
  description: 'Composition of 11 MoneyGram-published OpenAPI 3.0 YAML specifications (as of 2025-08-14) in its official developer
    GitLab repository. Every path is an external Path Item Reference to MoneyGram''s own request/response schema
    definitions, enums, errors and parameters. External references must be resolved at code-generation time with
    access to gitlab.com. This is not a self-contained or complete representation of all MoneyGram modules: some
    newer endpoints (for example, business disbursements) are not represented in those 11 published YAML files.
    MoneyGram''s specifications are pinned to the official 2025-08-14 source commit for reproducibility. MoneyGram authentication uses GET /oauth/accesstoken
    with Basic credentials and grant_type=client_credentials; the regular endpoints use Bearer tokens. For maximum
    compatibility, prefer generating each official MoneyGram module independently if the generator cannot resolve
    external Path Item references.'
  contact:
    name: MoneyGram Developer Support
    email: developersupport@moneygram.com
externalDocs:
  description: MoneyGram official API reference
  url: https://developer.moneygram.com/moneygram-developer/reference
servers:
- url: https://sandboxapi.moneygram.com
  description: MoneyGram sandbox (per current documentation)
- url: https://api.moneygram.com
  description: MoneyGram production (per current documentation)
