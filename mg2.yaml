components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: 'MoneyGram OAuth client credentials: MoneyGram publishes a GET token endpoint with an Authorization:
        Basic header. Some generators assume a POST token exchange; implement token fetching separately when needed.'
      flows:
        clientCredentials:
          tokenUrl: https://sandboxapi.moneygram.com/oauth/accesstoken?grant_type=client_credentials
          scopes:
            read: Grants read access
            write: Grants write access
